name: Capture official math.DS RSS

on:
  schedule:
    - cron: '15 11 * * 1-5'
      timezone: Europe/Warsaw
  workflow_dispatch:

concurrency:
  group: math-ds-rss-capture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install capture dependencies
        run: python -m pip install 'pydantic>=2.7,<3' 'PyYAML>=6.0,<7' 'requests>=2.31,<3' tzdata
      - name: Download and validate immutable input
        id: capture
        run: python -m src.capture_feed --github-output "$GITHUB_OUTPUT"
      - name: Commit only this validated capture
        env:
          INPUT_DIR: ${{ steps.capture.outputs.input_dir }}
        run: |
          git add -- "$INPUT_DIR/feed.xml" "$INPUT_DIR/manifest.json"
          if git diff --cached --quiet; then
            echo 'Identical input already archived; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture math.DS RSS input'
          git push origin HEAD:main
