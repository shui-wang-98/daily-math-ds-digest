name: Publish math.DS digest

on:
  push:
    branches: [main]
    paths:
      - 'data/reports/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: math-ds-pages
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  deploy-notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out committed reports
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for notification
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install notification dependencies
        run: python -m pip install 'pydantic>=2.7,<3' 'PyYAML>=6.0,<7' 'requests>=2.31,<3'

      - name: Check committed report artifacts
        run: python -m src.notify --check-only

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload committed site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Post or update GitHub Issue notification
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.notify --page-url "$PAGE_URL"
